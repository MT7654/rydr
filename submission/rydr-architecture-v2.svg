 x="847" y="251" font-family="Arial" font-size="20" fill="#555e6c">Source hashes and observations</text><text x="847" y="277" font-family="Arial" font-size="20" fill="#555e6c">Citations · collection receipt</text><rect x="1280" y="155" width="570" height="140" rx="18" fill="white" stroke="#dddfe7" stroke-width="2"/><rect x="1280" y="175" width="5" height="100" rx="2" fill="#f53267"/><text x="1302" y="192" font-family="Arial" font-size="26" font-weight="700" fill="#292e36">Policy &amp; precedent service</text><text x="1302" y="225" font-family="Arial" font-size="20" fill="#555e6c">Versioned Ryde sources + safeguards</text><text x="1302" y="251" font-family="Arial" font-size="20" fill="#555e6c">Approved comparable cases only</text><text x="1302" y="277" font-family="Arial" font-size="20" fill="#555e6c">Retrieval cannot override policy</text><rect x="60" y="405" width="480" height="175" rx="18" fill="white" stroke="#dddfe7" stroke-width="2"/><rect x="60" y="425" width="5" height="135" rx="2" fill="#f53267"/><text x="82" y="442" font-family="Arial" font-size="26" font-weight="700" fill="#292e36">Image Evidence Analyst</text><text x="82" y="475" font-family="Arial" font-size="20" fill="#555e6c">Live ADP pixels + local C2PA validation</text><text x="82" y="501" font-family="Arial" font-size="20" fill="#555e6c">EXIF time · duplicate / reuse checks</text><text x="82" y="527" font-family="Arial" font-size="20" fill="#555e6c">Originals stay private; derivatives to Tencent</text><text x="82" y="553" font-family="Arial" font-size="20" fill="#555e6c">Unknown provenance stays unknown</text><rect x="610" y="405" width="330" height="145" rx="18" fill="white" stroke="#dddfe7" stroke-width="2"/><rect x="610" y="425" width="5" height="105" rx="2" fill="#f53267"/><text x="632" y="442" font-family="Arial" font-size="26" font-weight="700" fill="#292e36">Rider Advocate</text><text x="632" y="475" font-family="Arial" font-size="20" fill="#555e6c">Source-grounded rider case</text><text x="6