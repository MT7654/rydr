 checks &#8594; approval</text><text x="1402" y="807" font-family="Arial" font-size="20" fill="#555e6c">Approved context can be reused or retired</text><rect x="1380" y="865" width="470" height="145" rx="18" fill="white" stroke="#dddfe7" stroke-width="2"/><rect x="1380" y="885" width="5" height="105" rx="2" fill="#f53267"/><text x="1402" y="902" font-family="Arial" font-size="26" font-weight="700" fill="#292e36">Independent remedies</text><text x="1402" y="935" font-family="Arial" font-size="20" fill="#555e6c">Driver reimbursement ≠ rider recovery</text><text x="1402" y="961" font-family="Arial" font-size="20" fill="#555e6c">Failed recovery keeps recorded driver relief</text><text x="1402" y="987" font-family="Arial" font-size="20" fill="#555e6c">Balanced test ledger · receipts · audit trail</text><text x="60" y="1046" font-family="Arial" font-size="20" fill="#5b6270">Live planning uses Navigator; live risk reasoning uses Judge deployment in a separate task. Originals, credentials and visitor records stay server-side.</text></svg>